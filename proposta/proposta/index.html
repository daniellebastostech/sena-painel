.big{font-size:2rem;font-weight:800;color:var(--pri);margin:0}

.sc{overflow-x:auto}

th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}

function cron(V,t,prazo,car){
  let saldo=V,Hp=0;const r=[];
  for(let y=1;y<=prazo;y++){
    const G=saldo*t,E=saldo+G,I=(y>car&&y<=prazo)?1/(prazo-car):0;
    const H=y==1?E*I:((I==0||Hp==0)?saldo*I:Hp);
    const P=Math.min(H+G,E),K=E-P;
    r.push({y,G,E,H,P,K});saldo=K;Hp=H;
  }
  return r;
}

  const im=(d.imoveis||[]).map(parseImovel).filter(Boolean);
  if(im.length){N.i=im;p.mun=im[0].mun}
  N.f.valor=d.valor||0;N.ficha={...d,_k:key};if(emCaso){Object.entries(N.p).forEach(([k,v])=>{if(v&&!(k=="civil"&&!CIVIL.includes(d.civil)))S.p[k]=v});if(im.length)S.i=N.i;if(d.valor)S.f.valor=N.f.valor;S.ficha=N.ficha}else S=N;save();tab=0;render()};
render();
</script>
<div id="lg" style="position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px"><form id="lf" style="background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px"><h2 style="margin:0">Proposta Pronaf/Pronamp</h2><small class="nt">Entre com o mesmo usuário e senha do Painel SENA.</small><label>Usuário<input id="lu" autocomplete="username" required></label><label>Senha<input id="lp" type="password" autocomplete="current-password" required></label><div id="le" style="color:var(--err);font-size:.85rem"></div><button class="p" id="lb">Entrar</button></form></div>
<script>
const CFG={URL:"https://script.google.com/macros/s/AKfycbxbN_P5FaVWFA-hZCycx1o8_v1LF9a461VNrypaUi5rjrXUF4-fE8Vz7HSlF60gB8zL/exec"};
let SES=null;try{SES=JSON.parse(sessionStorage.getItem("sena_ses"))}catch(e){}
const gl=$("#lg");if(SES&&SES.token)gl.style.display="none";
function mostraLogin(){gl.style.display="flex"}
function sair(){try{sessionStorage.removeItem("sena_ses")}catch(e){}if(SES&&SES.token)fetch(CFG.URL,{method:"POST",keepalive:true,body:JSON.stringify({acao:"logout",token:SES.token})}).catch(()=>{});SES=null;mostraLogin()}
async function api(acao,extra={}){const r=await fetch(CFG.URL,{method:"POST",body:JSON.stringify({acao,token:SES&&SES.token,...extra})});const j=await r.json();if(j.error){if(/sess/i.test(j.error)){SES=null;try{sessionStorage.removeItem("sena_ses")}catch(e){}mostraLogin()}throw new Error(j.error)}return j}
$("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#lb");b.disabled=true;$("#le").textContent="";
  try{const r=await fetch(CFG.URL,{method:"POST",body:JSON.stringify({acao:"login",usuario:$("#lu").value,senha:$("#lp").value})});const j=await r.json();if(j.error)throw new Error(j.error);
    SES={token:j.token,nome:j.nome,perfil:j.perfil};try{sessionStorage.setItem("sena_ses",JSON.stringify(SES))}catch(x){}gl.style.display="none"}
  catch(er){$("#le").textContent=/fetch|network|json/i.test(er.message)?"Não foi possível conectar ao servidor.":er.message}
  finally{b.disabled=false;$("#lp").value=""}};
const nk=k=>String(k).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const dig=s=>String(s||"").replace(/\D/g,"");
const sp=(s,sep)=>String(s||"").split(sep).map(x=>x.trim()).filter(Boolean);
const dtp=v=>{if(!v)return null;v=String(v);let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return new Date(+m[3],m[2]-1,+m[1]);const d=new Date(v);return isNaN(d)?null:d};
const iso=d=>d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):"";
function fichaDe(r){const o={};for(const k in r)o[nk(k)]=r[k];const dd=dtp(o.data_atendimento)||dtp(o.registrado_em||o.carimbo_de_data_hora||o.timestamp);
  return{_t:dd?+dd:0,cliente:o.cliente,nome:o.cliente||o.nome_completo,nome_completo:o.nome_completo,cpf:o.cpf,nasc:iso(dtp(o.data_nascimento)),civil:o.estado_civil,conj:o.conjuge_nome,cpfc:o.conjuge_cpf,fone:o.telefone,end:o.endereco,banco:o.banco,ag:o.agencia,conta:o.conta,
    imoveis:sp(o.imoveis_detalhes," || "),animais:sp(o.plantel_animais," | "),forragens:sp(o.forragicultura," | "),pisc:sp(o.piscicultura," | "),avic:sp(o.avicultura," | "),objeto:o.objeto_financiamento,tipo:o.tipo_finalidade,valor:num2(o.valor_aproximado),
    renda:o.fontes_renda,fat:o.faturamento_rural,outras:o.outras_receitas,dividas:o.dividas_vigentes,garantias:o.bens_garantias,avalista:o.avalista_terceiro,obs:o.observacoes_finais,resp:o.responsavel,data:dd?dd.toLocaleDateString("pt-BR"):""}}
let tm;const agenda=()=>{clearTimeout(tm);if(dig(S.p.doc).length==11)tm=setTimeout(()=>puxar(S.p.doc,true),700)};
async function puxar(cpf,emCaso){const m=$("#bm"),c=dig(cpf);if(c.length!=11){m.textContent="Digite o CPF completo (11 números).";return}
  if(!(SES&&SES.token)){mostraLogin();return}
  m.textContent="Buscando ficha...";
  try{let rows;
    try{const j=await api("buscarCpf",{cpf:c});rows=j.dados||(j.ficha?[j.ficha]:[])}catch(e){if(/sess/i.test(e.message))throw e;const j=await api("listar");rows=j.dados||[]}
    const f=rows.map(fichaDe).filter(x=>dig(x.cpf)==c).sort((a,b)=>b._t-a._t)[0];
    if(!f){m.textContent="Nenhuma ficha encontrada com esse CPF. Preencha a ficha no painel primeiro.";return}
    carregarFicha(f,emCaso);$("#bm").textContent="Ficha de "+(f.nome||"cliente")+" carregada ("+(f.data||"sem data")+"). Dados do proponente e dos imóveis preenchidos.";}
  catch(e){m.textContent="Não foi possível buscar: "+e.message}}
</script>
